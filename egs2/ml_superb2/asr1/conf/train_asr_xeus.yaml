model_conf:
    ctc_weight: 1.0
    extract_feats_in_collect_stats: false

use_amp: true
unused_parameters: false
freeze_param: ["frontend.xeus_model"]
num_att_plot: 0

frontend: xeus
frontend_conf:
    checkpoint: xeus/xeus_checkpoint.pth
    config: xeus/config.yaml
    use_mask: false
    use_final_output: false
    multilayer_feature: true

preencoder: linear
preencoder_conf:
    input_size: 1024  # Note: If the upstream is changed, please change this value accordingly.
    output_size: 80

num_workers: 4
batch_type: sorted
batch_size: 1
accum_grad: 16
patience: none
init: none
best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 2

optim: adam
optim_conf:
    lr: 0.0002
    weight_decay: 0.000001

specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 27
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
    - 0.
    - 0.05
    num_time_mask: 10

num_iters_per_epoch: 10000 # number of iterations per epoch
max_epoch: 50
